<title>My Films</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14213a;--mut:#5d6b85;--line:#d8dfeb;--acc:#0b5bd3;--onacc:#fff;--bd:#0b5bd3;--uhd:#111;--dvd:#8a94a6;--warn:#b4531a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1524;--card:#18223a;--ink:#e8edf7;--mut:#9aa8c4;--line:#2a3856;--acc:#5b9bff;--onacc:#0a1228;--bd:#5b9bff;--uhd:#e8c25a;--dvd:#7d8aa5;--warn:#f0a068}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.5rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 14px}
.bar{display:flex;gap:8px;margin-bottom:10px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
button{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;margin-bottom:12px}
.row>*{flex:1;min-width:0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;overflow:hidden;cursor:pointer}
.sp{width:12px;flex:none;background:var(--bd)}
.sp.uhd{background:var(--uhd)}.sp.dvd{background:var(--dvd)}
.in{padding:10px 12px 10px 0;min-width:0;flex:1}
.t{font-weight:600;overflow-wrap:anywhere}
.m{color:var(--mut);font-size:.88rem}
.tag{display:inline-block;font-size:.8rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin:4px 6px 0 0}
.tag.l{color:var(--warn);border-color:var(--warn)}
.tag.v{color:var(--acc);border-color:var(--acc)}
.empty{color:var(--mut);text-align:center;padding:28px 10px;border:1px dashed var(--line);border-radius:8px}
#ed{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5;overflow:auto}
#ed.on{display:block}
.sheet{background:var(--bg);max-width:640px;margin:0 auto;min-height:100%;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:.9rem;color:var(--mut);margin:10px 0 4px}
video{width:100%;max-height:220px;background:#000;border-radius:8px;margin-top:8px;display:none}
.msg{color:var(--warn);font-size:.9rem;margin-top:6px}
.foot{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.foot button{flex:1}
.del{color:var(--warn);border-color:var(--warn)}
.sg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sg button{display:flex;gap:10px;align-items:center;text-align:left;padding:6px}
img.po{width:46px;height:69px;object-fit:cover;border-radius:3px;flex:none;background:var(--line)}
li img.po{margin:8px 0 8px 0}
details{margin-top:16px}
summary{cursor:pointer;color:var(--mut)}
.sp.fol{background:#d9a441}
.crumbs,.acts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center;color:var(--mut)}
.crumbs button,.acts button{padding:6px 10px;font-size:.9rem}
li{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
li img{pointer-events:none;-webkit-user-drag:none;user-drag:none}
li.fo.drop,#bc button.drop{outline:2px dashed var(--acc);outline-offset:2px;background:var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:.9rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
#home{max-width:640px;margin:0 auto;padding:18px 14px 40px;text-align:center}
#home h1{font-size:1.9rem;margin:8px 0 2px}
#home h1 a,#app h1 a{color:inherit;text-decoration:none}
#home h1 a{display:inline-flex;align-items:center;gap:.3em}
#app .sub{text-align:center}
.hc{color:var(--mut);margin:0 0 16px}
.hw{max-width:520px;margin:0 auto}
.hbar{display:flex;gap:8px;margin-bottom:12px}
#hrnd{width:33.3%;min-width:96px;padding:8px 6px;font-size:.85rem;font-weight:600}
#hpic{width:100%;max-width:520px;border-radius:10px;display:block;margin:18px auto 0}
#hres{max-width:520px;margin:14px auto 0;text-align:left}
.hl button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;margin-bottom:6px;padding:6px}
.hf{text-align:center}
.hf img,.hf .nop{height:min(50vh,430px);width:auto;max-width:86vw;aspect-ratio:2/3;object-fit:cover;border-radius:8px;display:block;margin:6px auto 10px;background:var(--line)}
.hf .nop{display:flex;align-items:center;justify-content:center;padding:14px;font-weight:600;font-size:1.3rem;background:var(--acc);color:var(--onacc);box-sizing:border-box}
#app h1{text-align:center}
.back{font-weight:700;display:inline-block;margin-bottom:6px;color:var(--mut);text-decoration:none;font-size:.9rem}
@media (min-width:900px){
#home{max-width:900px}
#home h1{font-size:2.4rem}
.hc{font-size:1.1rem}
.hw,#hres{max-width:720px}
#hpic{max-width:800px}
.hf img,.hf .nop{height:min(62vh,560px);max-width:none}
main#app{max-width:1000px}
#list{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
#list li{margin-bottom:0}
#list .empty{grid-column:1/-1}
}
@media (min-width:1300px){
main#app{max-width:1300px}
#list{grid-template-columns:repeat(3,1fr)}
}
/* ---- Style moderne ---- */
:root{--pb1:#3b82f6;--pb2:#6366f1;--pbt:#fff;--glass:rgba(255,255,255,.76);--gb:rgba(255,255,255,.92);--sh:0 8px 24px rgba(40,70,140,.12);--grad:linear-gradient(135deg,#2f7bff,#6a5cf5)}
html{background-color:#eef3fd;background-attachment:fixed;

button,input,select{border-radius:14px;transition:transform .15s,box-shadow .15s,filter .15s,border-color .15s}
input,select{min-height:44px;border:1px solid rgba(160,180,225,.55);background-color:var(--glass);box-shadow:0 2px 8px rgba(40,70,140,.06)}
input:focus,select:focus{outline:none;border-color:#6a8dff;box-shadow:0 0 0 4px rgba(90,130,255,.18)}
select{appearance:none;-webkit-appearance:none;padding-right:36px;background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%235b6b95%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:16px}
#q,#hq{padding-left:42px;background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%235b6b95%22 stroke-width=%222.5%22 stroke-linecap=%22round%22%3E%3Ccircle cx=%2210%22 cy=%2210%22 r=%226%22/%3E%3Cpath d=%22M15 15l6 6%22/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:14px center;background-size:18px}
.hbar input{border-radius:99px;min-height:48px}
.hbar button{border-radius:99px;padding:0 22px}
button{background:var(--glass);border:1px solid var(--gb);box-shadow:0 2px 8px rgba(40,70,140,.08)}
button.p{background:var(--grad);border:0;color:#fff;font-weight:600;box-shadow:0 8px 18px rgba(70,100,240,.35)}
button.p:hover{filter:brightness(1.07);transform:translateY(-1px)}
#add{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;font-size:1.02rem;border-radius:16px}
#hrnd{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:140px;height:40px;white-space:nowrap;font-weight:700;color:#3b4fd8;border:1.5px solid transparent;border-radius:99px;background-image:linear-gradient(#fff,#fff),var(--grad);background-origin:border-box;background-clip:padding-box,border-box;box-shadow:0 6px 16px rgba(70,100,240,.18)}
#hrnd:hover{transform:translateY(-1px)}
#home h1{font-size:2.2rem;font-weight:800;letter-spacing:-.02em}
#home h1 a{display:inline-flex;align-items:center;gap:.35em;background:linear-gradient(135deg,#1e3a8a,#5046e5);-webkit-background-clip:text;background-clip:text;color:transparent}
#home h1 a svg{color:#4a52e0}
#hcnt{display:block;width:fit-content;margin:0 auto 18px;padding:4px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--gb);box-shadow:var(--sh);color:#4a5a86;font-weight:600}
#hcnt::before,#hcnt::after{display:none}
#hpic{border:5px solid rgba(255,255,255,.95);border-radius:24px;box-shadow:0 22px 50px rgba(50,80,170,.28)}
@media (max-width:480px){#home h1{font-size:1.7rem}}
#app h1{display:flex;align-items:center;gap:14px;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
#app h1 a{color:#1e2f6b}
#app h1::before,#app h1::after{content:"";flex:1;height:2px;border-radius:2px}
#app h1::before{background:linear-gradient(90deg,transparent,#a9b9e3)}
#app h1::after{background:linear-gradient(270deg,transparent,#a9b9e3)}
#app .sub{width:fit-content;margin:0 auto 16px;padding:3px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--gb);color:#4a5a86;font-weight:600}
.back{color:#3b4fd8;font-weight:700}
li{background:var(--glass);border:1px solid var(--gb);border-radius:16px;box-shadow:var(--sh);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s,box-shadow .15s}
li:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(50,80,170,.2)}
.sp{width:5px;margin:12px 0 12px 12px;border-radius:99px}
.sp.fol{background:linear-gradient(180deg,#ffc94d,#f59e0b)}
li img.po{width:52px;height:78px;border-radius:8px;margin:10px 0;box-shadow:0 4px 10px rgba(30,50,110,.25);object-fit:cover}
li .in{padding:10px 14px 10px 0}
li .t{font-weight:700}
li.fo .t{text-transform:uppercase;letter-spacing:.02em}
li.fo .fi{width:42px;height:42px;padding:8px;box-sizing:border-box;border-radius:12px;background:linear-gradient(135deg,#fff2cf,#ffdc8a);align-self:center;flex:none}
.tag{border:0;border-radius:99px;font-weight:600;font-size:.75rem;padding:2px 10px;background:#fff1cc;color:#a16207}
.tag.v{background:#dcfce7;color:#15803d}
.tag.l{background:#ffe4de;color:#b4531a}
.crumbs button,.acts button{border-radius:99px}
#ed{background:rgba(20,30,70,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{margin-top:5vh;min-height:95%;border-radius:24px 24px 0 0;background:linear-gradient(180deg,#f7f9ff,#e8eefc);box-shadow:0 -12px 40px rgba(20,30,70,.3)}
@media (prefers-color-scheme:dark){
:root{--glass:rgba(24,34,58,.78);--gb:rgba(255,255,255,.08);--sh:0 8px 24px rgba(0,0,0,.35)}
:root{background-color:#0e1524}
:root{background-image:none}
:root body::before{display:none}
:root #home h1 a{background:linear-gradient(135deg,#bcd0ff,#a5a0ff);-webkit-background-clip:text;background-clip:text}
:root #app h1 a{color:var(--ink)}
:root #hrnd{background-image:linear-gradient(var(--card),var(--card)),var(--grad);color:#bcd0ff}
:root .tag{background:rgba(255,255,255,.08);color:var(--ink)}
:root .sheet{background:var(--bg)}
}
.sig{margin:16px 0 4px;font-weight:700;letter-spacing:.02em;color:#4a52e0}
.tmdb{max-width:520px;margin:0 auto;font-size:.78rem;color:var(--mut)}
.tmdb a{color:inherit}
</style>

function show(res){
  var h='';res.slice(0,6).forEach(function(m,i){
    h+='<button type="button" data-i="'+i+'">'+(m.poster_path?'<img class="po" alt="" src="https://image.tmdb.org/t/p/w154'+m.poster_path+'">':'')+'<span>'+esc(m.title)+' ('+esc((m.release_date||'').slice(0,4)||'?')+')</span></button>';
  });
  $('sg').innerHTML=h;$('sg').onclick=function(e){
    var b=e.target.closest('button');if(!b)return;var m=res[+b.getAttribute('data-i')];
    pick(m);
  };
}
$('f-t').oninput=function(){
  clearTimeout(tmr);$('scmsg').textContent='';var v=this.value.trim();if(v.length<2){$('sg').innerHTML='';return}
  tmr=setTimeout(function(){tm(v).then(function(r){if(r)show(r)})},400);
};
$('bf').onclick=function(){
  if(!tk()){$('stmsg').textContent='Ajoute d’abord ta clé TMDB.';return}
  var todo=items.filter(function(d){return d.k!=='f'&&!d.del&&!(d.g&&d.g.length)}),n=0,i=0;
  if(!todo.length){$('stmsg').textContent='Rien à compléter.';return}
  (function next(){
    if(i>=todo.length){save();render();$('stmsg').textContent=n+' fiche(s) complétée(s) sur '+todo.length+'.';return}
    var d=todo[i++];$('stmsg').textContent='Complétion… '+i+'/'+todo.length;
    tm(d.t).then(function(r){r=r||[];
      var m=r.filter(function(x){return d.y&&(x.release_date||'').slice(0,4)===d.y})[0]||r[0];
      if(m){d.g=(m.genre_ids||[]).map(function(g){return GN[g]}).filter(Boolean);if(!d.p&&m.poster_path)d.p=m.poster_path;if(!d.y&&m.release_date)d.y=m.release_date.slice(0,4);if(d.g.length){n++;d.u=Date.now()}}
      setTimeout(next,250);
    });
  })();
};
$('bc').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-go')){cwd=b.getAttribute('data-go')||null;render();return}
  var a=b.getAttribute('data-a'),f=items.filter(function(x){return x.id===cwd})[0],n;
  if(a==='new'){n=prompt('Nom du nouveau dossier :');if(n&&n.trim()){items.push({id:uid(),k:'f',t:n.trim(),par:cwd,u:Date.now()});save();render()}}
  else if(a==='ren'&&f){n=prompt('Nouveau nom du dossier :',f.t);if(n&&n.trim()){f.t=n.trim();f.u=Date.now();save();render()}}
  else if(a==='del'&&f&&confirm('Supprimer le dossier « '+f.t+' » ? Son contenu (disques et sous-dossiers) sera déplacé dans le dossier parent.')){
    var up=f.par||null;
    items.forEach(function(x){if(x.k==='f'){if((x.par||null)===cwd){x.par=up;x.u=Date.now()}}else if((x.fo||null)===cwd){x.fo=up;x.u=Date.now()}});
    items=items.map(function(x){return x.id===cwd?{id:x.id,del:true,u:Date.now()}:x});cwd=up;save();render();
  }
};
function descIds(id){var o=[id];items.forEach(function(f){if(f.k==='f'&&(f.par||null)===id)o=o.concat(descIds(f.id))});return o}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2200)}
function dtarget(x,y){
  var el=document.elementFromPoint(x,y),t=el&&el.closest?el.closest('li.fo,#bc [data-go]'):null;
  if(!t)return null;
  var id=t.hasAttribute('data-go')?(t.getAttribute('data-go')||null):t.getAttribute('data-fid');
  if(dr.fol&&id&&descIds(dr.id).indexOf(id)>-1)return null;
  return{el:t,id:id};
}
function dstart(){
  dr.on=true;var r=dr.li.getBoundingClientRect(),g=dr.li.cloneNode(true);
  g.style.cssText='position:fixed;z-index:50;pointer-events:none;opacity:.85;margin:0;box-shadow:0 8px 24px rgba(0,0,0,.35);width:'+r.width+'px;left:'+r.left+'px;top:'+r.top+'px';
  dr.ox=dr.x-r.left;dr.oy=dr.y-r.top;dr.ghost=g;document.body.appendChild(g);dr.li.style.opacity='.35';
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
}
function dend(t){
  if(!dr)return;var d=dr;dr=null;clearTimeout(d.t);
  if(d.ghost)d.ghost.remove();d.li.style.opacity='';
  var h=document.querySelector('.drop');if(h)h.classList.remove('drop');
  if(!d.on)return;
  sup=true;setTimeout(function(){sup=false},80);
  if(!t)return;
  var it=items.filter(function(x){return x.id===d.id})[0];if(!it)return;
  if(t.id===(d.fol?(it.par||null):(it.fo||null)))return;
  if(d.fol)it.par=t.id;else it.fo=t.id;it.u=Date.now();
  var tf=items.filter(function(x){return x.id===t.id})[0];
  save();render();toast('Déplacé dans « '+(tf?tf.t:'Accueil')+' »');
}
$('list').addEventListener('pointerdown',function(e){
  var li=e.target.closest('li');if(!li||e.button>0||!$('bc').firstChild)return;
  dr={li:li,x:e.clientX,y:e.clientY,id:li.getAttribute('data-fid')||li.getAttribute('data-id'),fol:!!li.getAttribute('data-fid'),on:false,t:null};
  if(e.pointerType==='touch')dr.t=setTimeout(function(){if(dr&&!dr.on)dstart()},400);
});
document.addEventListener('pointermove',function(e){
  if(!dr)return;
  var dx=e.clientX-dr.x,dy=e.clientY-dr.y,dist=Math.sqrt(dx*dx+dy*dy);
  if(!dr.on){
    if(e.pointerType==='touch'){if(dist>10){clearTimeout(dr.t);dr=null}return}
    if(dist>6)dstart();else return;
  }
  dr.ghost.style.left=(e.clientX-dr.ox)+'px';dr.ghost.style.top=(e.clientY-dr.oy)+'px';
  var h=document.querySelector('.drop'),t=dtarget(e.clientX,e.clientY);
  if(h&&(!t||h!==t.el))h.classList.remove('drop');
  if(t)t.el.classList.add('drop');
  if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-70)window.scrollBy(0,14);
});
document.addEventListener('pointerup',function(e){if(!dr)return;dend(dr.on?dtarget(e.clientX,e.clientY):null)});
document.addEventListener('pointercancel',function(){dend(null)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(dr)dend(null);else if($('ed').classList.contains('on'))close()}});
document.addEventListener('touchmove',function(e){if(dr&&dr.on)e.preventDefault()},{passive:false});
$('list').addEventListener('contextmenu',function(e){if(dr)e.preventDefault()});
$('list').addEventListener('dragstart',function(e){e.preventDefault()});
$('exp').onclick=function(){
  var b=new Blob([JSON.stringify(items.filter(function(x){return !x.del}),null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-films-sauvegarde.json';
  document.body.appendChild(a);a.click();a.remove();
  try{localStorage.setItem(BK,String(Date.now()))}catch(e){}
  status();
};
$('imp').onclick=function(){$('file').click()};
$('file').onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{
      var a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;a=clean(a);
      var idx={};items.forEach(function(x,i){idx[x.id]=i});
      var n=0;a.forEach(function(x){
        if(!x||!x.t||x.del)return;
        if(!(x.id in idx)){items.push(x);n++}
        else if(items[idx[x.id]].del){x.u=Date.now();items[idx[x.id]]=x;n++}
      });
      save();render();$('stmsg').textContent=n+' disque(s) importé(s).';
    }catch(e){$('stmsg').textContent='Fichier invalide : choisis un export de cette appli.'}
  };
  r.readAsText(f);this.value='';
};
var hid=null,hlast=null;
function discsAll(){return items.filter(function(x){return x.k!=='f'&&!x.del})}
function hcount(){var n=discsAll().length;$('hcnt').textContent=n+(n>1?' films':' film')}
function hnorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function hfind(q){var n=hnorm(q).trim();if(!n)return[];return discsAll().filter(function(d){return hnorm([d.t,d.y,d.e,(d.g||[]).join(' ')].join(' ')).indexOf(n)>-1}).sort(function(a,b){return a.t.localeCompare(b.t,'fr',{sensitivity:'base'})})}
function hclear(){hid=null;$('hres').innerHTML='';$('hpic').style.display=''}
function hlist(r){
  hid=null;$('hpic').style.display='none';
  if(!r.length){$('hres').innerHTML='<p class="m" style="text-align:center">Aucun film trouvé.</p>';return}
  var h='<div class="hl">';
  r.slice(0,8).forEach(function(d){h+='<button data-id="'+d.id+'">'+(d.p?'<img class="po" alt="" draggable="false" src="https://image.tmdb.org/t/p/w154'+d.p+'">':'')+'<span>'+esc(d.t)+(d.y?' ('+esc(d.y)+')':'')+'</span></button>'});
  if(r.length>8)h+='<p class="m">'+(r.length-8)+' autres résultats : précise ta recherche.</p>';
  $('hres').innerHTML=h+'</div>';
}
function hfilm(id){
  var d=items.filter(function(x){return x.id===id&&x.k!=='f'&&!x.del})[0];if(!d){hclear();return}
  hid=id;$('hpic').style.display='none';
  var meta=[d.y,d.f,(d.g||[]).slice(0,3).join(', ')].filter(Boolean).join(' · ');
  $('hres').innerHTML='<div class="hf">'+(d.p?'<img alt="Jaquette de '+esc(d.t)+'" draggable="false" src="https://image.tmdb.org/t/p/w500'+d.p+'">':'<div class="nop">'+esc(d.t)+'</div>')+'<div class="t">'+esc(d.t)+'</div><div class="m">'+esc(meta)+'</div><div class="acts" style="justify-content:center;margin-top:10px"><button data-h="open">Ouvrir la fiche</button><button data-h="close">Fermer</button></div></div>';
}
function hrefresh(){if(hid)hfilm(hid)}
function hgo(){var v=$('hq').value.trim();if(!v){toast('Tape le titre d’un film.');return}var r=hfind(v);if(r.length===1)hfilm(r[0].id);else hlist(r)}
$('hq').oninput=function(){var v=this.value.trim();if(!v){hclear();return}hlist(hfind(v))};
$('hq').onkeydown=function(e){if(e.key==='Enter')hgo()};
$('hgo').onclick=hgo;
$('hrnd').onclick=function(){
  var d=discsAll();if(!d.length){toast('Aucun disque dans la collection.');return}
  var p=d.length>1?d.filter(function(x){return x.id!==hlast}):d;
  hlast=p[rint(p.length)].id;$('hq').value='';hfilm(hlast);
};
$('hres').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.getAttribute('data-id')){hfilm(b.getAttribute('data-id'));return}
  var a=b.getAttribute('data-h');
  if(a==='open'&&hid)open(hid);else if(a==='close'){$('hq').value='';hclear()}
};
function route(){var l=location.hash==='#liste';$('home').style.display=l?'none':'';$('app').style.display=l?'':'none';window.scrollTo(0,0);if(l)render();else hcount()}
window.addEventListener('hashchange',route);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
warn();render();pull();route();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
